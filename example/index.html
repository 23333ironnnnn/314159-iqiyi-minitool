<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>末班车</title>
  <link rel="stylesheet" href="style.css">
  <script src="story.js" defer></script>
</head>
<body>
  <main>
    <h1>末班车</h1>
    <p id="story" aria-live="polite">末班车进站前，你在长椅下捡到一把钥匙。司机摇下车窗，问你还走不走。</p>
    <button id="stay" type="button">留下等失主</button>
    <button id="ride" type="button">带钥匙上车</button>
    <button id="again" type="button" hidden>再选一次</button>
  </main>
</body>
</html>
